title: 健康生活方式：户外集体运动
theme: 身份认同
published: true
image: /assets/images/截屏2026-11-18 下午9.56.13.png
summary: 观察户外集体运动，讨论健康生活方式与文化习惯。
questions:
  - heading: 描述图片 · Describe
    zh: 图片里有什么人？他们在哪里？正在做什么？你注意到哪些细节？
    en: Who is in the picture? Where are they? What are they doing? What details do
      you notice?
  - heading: 联系主题 · Connect
    zh: 这张图片与健康生活方式有什么关系？人们为什么参加这样的活动？
    en: How is this picture related to a healthy lifestyle? Why do people
      participate in activities like this?
  - heading: 联系文化 · Explore culture
    zh: 这种活动让你想到中国或其他地方的什么生活习惯？比较一下。
    en: What lifestyle habits or cultural practices in China or other places does
      this activity remind you of? How are they similar or different?
  - heading: 表达观点 · Reflect
    zh: 你认为这种活动有哪些好处或挑战？你自己会参加吗？为什么？
    en: What are the benefits or challenges of this activity? Would you participate
      in it? Why or why not?
